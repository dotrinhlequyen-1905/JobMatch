server {
    listen 80;
    client_max_body_size 6m;
    # Phân giải lại tên service qua DNS của Docker: container backend/frontend được tạo lại (đổi IP)
    # vẫn kết nối được mà không phải khởi động lại nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;
    set $frontend_upstream frontend:80;
    location /api/v1/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /docs { proxy_pass http://$backend_upstream; }
    location /openapi.json { proxy_pass http://$backend_upstream; }
    location / { proxy_pass http://$frontend_upstream; }
}
