[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "jobmatch-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4", "alembic>=1.13,<2", "pydantic-settings>=2,<3",
  "pyjwt>=2.8,<3", "bcrypt>=4,<6", "python-multipart>=0.0.9",
  "email-validator>=2,<3", "celery[redis]>=5.4,<6", "pgvector>=0.3,<1",
  "numpy>=1.26,<3", "python-docx>=1,<2", "pymupdf>=1.24,<2", "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Checkpoint trong models/ được lưu bằng sentence-transformers 6.1 (xem config_sentence_transformers.json).
ai = ["sentence-transformers>=6.1,<7"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "pyyaml>=6,<7"]
research = ["pandas", "pyarrow", "tqdm", "reportlab", "openpyxl", "datasets", "accelerate", "rank_bm25", "playwright"]

[tool.setuptools]
packages = ["app", "app.api", "app.api.v1", "app.ai", "app.core", "app.repositories", "app.schemas", "app.services", "app.tasks", "data_pipeline"]

[tool.setuptools.package-dir]
app = "app"
data_pipeline = "../data_pipeline"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
