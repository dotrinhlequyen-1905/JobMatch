services:
  backend:
    environment:
      ENABLE_DEV_TOOLS: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/workspace/backend
      - ./data_pipeline:/workspace/data_pipeline:ro
      - ./frontend/public/images/companies/catalog.json:/workspace/frontend/public/images/companies/catalog.json:ro
  frontend:
    build:
      target: development
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
  nginx:
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
  celery-worker:
    volumes:
      - ./backend:/workspace/backend
      - ./data_pipeline:/workspace/data_pipeline:ro
  celery-beat:
    volumes:
      - ./backend:/workspace/backend

volumes:
  frontend_modules:
